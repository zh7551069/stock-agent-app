<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>选股复盘 · stock-advice-agent</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="选股复盘">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- 图标：统一 2px 线性，与设计语言一致 -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5 7.5 12 15 19.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 4.5 16.5 12 9 19.5"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-market" viewBox="0 0 24 24"><path d="M3.5 19.5h17"/><path d="M5 16V9M9.5 16V6M14 16v-4.5M18.5 16V8"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 16.5l5-5 3.5 3 5-6.5"/><path d="M20.5 8h-4M20.5 8v4"/><path d="M3 20.5h18"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 20.5 8 12 12.5 3.5 8z"/><path d="M3.5 12.2 12 16.7l8.5-4.5"/><path d="M3.5 16.2 12 20.7l8.5-4.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M8.5 3v18"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6.5 3H15l4.5 4.5V21H6.5z"/><path d="M9.5 11.5h6M9.5 15.5h6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z"/><path d="M12 9.5v4.5M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
  <symbol id="i-liupan" viewBox="0 0 24 24"><path d="M4 19.5h4.5V12H4z"/><path d="M9.75 19.5h4.5V8.5h-4.5z"/><path d="M15.5 19.5H20V5h-4.5z"/><path d="M3 21.5h18"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.2 8.2 10.8 15.6M16.8 8.2 13.2 15.6"/></symbol>
</svg>

<div id="app" data-market="cn">

  <header class="appbar" id="appbar"></header>

  <main class="view" id="view">
    <div class="card" style="margin-top:calc(32 * var(--u))">
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
      <div class="skel skel-row"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-tab="liupan"><svg class="ic"><use href="#i-liupan"/></svg>连板股</button>
    <button class="tab-btn" data-tab="home"><svg class="ic"><use href="#i-trend"/></svg>推荐</button>
    <button class="tab-btn" data-tab="market"><svg class="ic"><use href="#i-market"/></svg>大盘</button>
    <button class="tab-btn" data-tab="strategies"><svg class="ic"><use href="#i-layers"/></svg>策略</button>
    <button class="tab-btn" data-tab="cards"><svg class="ic"><use href="#i-book"/></svg>知识卡</button>
    <button class="tab-btn" data-tab="playbook"><svg class="ic"><use href="#i-scroll"/></svg>手册</button>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-scrim" data-close-sheet></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
